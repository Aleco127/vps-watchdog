name: watchdog

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub puede retrasar las corridas programadas varios minutos
    - cron: "17 12 1 * *"    # keepalive mensual (GitHub apaga los cron tras 60 días sin actividad)
  workflow_dispatch:
    inputs:
      simular_caida:
        description: "Simular una caída para probar el aviso (la siguiente corrida normal avisa la recuperación)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    if: github.event.schedule != '17 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT: ${{ secrets.TELEGRAM_BOT }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SIMULAR_CAIDA: ${{ inputs.simular_caida }}

  keepalive:
    if: github.event.schedule == '17 12 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "watchdog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive"
          git push
